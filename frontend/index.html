<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#141518"
      media="(prefers-color-scheme: dark)"
    />
    <title>Standupless</title>
    <meta
      name="description"
      content="Standupless is an issue tracker for small software teams. Plan work, track issues across projects, and see what changed without holding a meeting."
    />
    <link rel="canonical" href="https://standupless.dev/" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Standupless" />
    <meta property="og:title" content="Standupless" />
    <meta
      property="og:description"
      content="An issue tracker for small software teams. Plan work, track issues across projects, and see what changed without holding a meeting."
    />
    <meta property="og:url" content="https://standupless.dev/" />
    <meta property="og:image" content="https://standupless.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Standupless mark and name." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Standupless" />
    <meta
      name="twitter:description"
      content="An issue tracker for small software teams. Plan work, track issues across projects, and see what changed without holding a meeting."
    />
    <meta name="twitter:image" content="https://standupless.dev/og.png" />

    <script>
      try {
        var theme = localStorage.getItem('standupless-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; text-align: center">
        Standupless requires JavaScript. Please enable JavaScript in your
        browser.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
