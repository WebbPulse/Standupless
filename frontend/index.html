<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141518" media="(prefers-color-scheme: dark)" />
    <title>Standupless</title>
    <meta
      name="description"
      content="Standupless is an issue tracker for teams. Sign in to see your workspaces."
    />
    <link rel="canonical" href="https://standupless.dev/" />
    <script>
      try {
        var theme = localStorage.getItem('standupless-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; text-align: center">
        Standupless requires JavaScript. Please enable JavaScript in your
        browser.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
