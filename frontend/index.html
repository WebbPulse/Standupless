<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141518" />
    <title>Standupless</title>
    <meta
      name="description"
      content="Standupless is an issue tracker for small software teams. Plan work, track issues across projects, and see what changed without holding a meeting."
    />
    <link rel="canonical" href="https://standupless.dev/" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Standupless" />
    <meta property="og:title" content="Standupless" />
    <meta
      property="og:description"
      content="An issue tracker for small software teams. Plan work, track issues across projects, and see what changed without holding a meeting."
    />
    <meta property="og:url" content="https://standupless.dev/" />
    <meta property="og:image" content="https://standupless.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Standupless mark and name." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Standupless" />
    <meta
      name="twitter:description"
      content="An issue tracker for small software teams. Plan work, track issues across projects, and see what changed without holding a meeting."
    />
    <meta name="twitter:image" content="https://standupless.dev/og.png" />

    <script>
      try {
        var theme = localStorage.getItem('standupless-theme');
        var root = document.documentElement;
        if (theme === 'light') {
          root.setAttribute('data-theme', 'light');
        } else if (theme === 'system') {
          root.removeAttribute('data-theme');
        }
        if (
          theme === 'light' ||
          (theme === 'system' &&
            !window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', '#ffffff');
        }
      } catch (error) {}
      try {
        var match = /^\/w\/([^/]+)/.exec(window.location.pathname);
        var accents = match
          ? JSON.parse(localStorage.getItem('standupless-accent') || '{}')
          : null;
        var accent = accents && accents[decodeURIComponent(match[1])];
        if (accent && typeof accent === 'object') {
          var style = document.documentElement.style;
          for (var name in accent) {
            if (
              /^--ws-(light|dark)-[a-z-]+$/.test(name) &&
              /^#[0-9a-f]{6}$/.test(accent[name])
            ) {
              style.setProperty(name, accent[name]);
            }
          }
          document.documentElement.setAttribute('data-accent', '');
        }
      } catch (error) {}
    </script>
    <style>
      .boot-splash {
        --boot-bg: #141518;
        --boot-mark: #f2703a;
        --boot-track: #3a3c44;
        --boot-head: #9b9da7;
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background-color: var(--boot-bg);
      }
      :root[data-theme='light'] .boot-splash {
        --boot-bg: #ffffff;
        --boot-mark: #b8451a;
        --boot-track: #cfd0d7;
        --boot-head: #62646f;
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme]) .boot-splash {
          --boot-bg: #ffffff;
          --boot-mark: #b8451a;
          --boot-track: #cfd0d7;
          --boot-head: #62646f;
        }
      }
      html:not([data-prerender='stale']) #root:not(:empty) ~ #boot-splash {
        display: none;
      }
      .boot-splash .boot-splash-mark {
        display: block;
        color: var(--boot-mark);
      }
      .boot-splash-spinner {
        box-sizing: border-box;
        width: 16px;
        height: 16px;
        border-radius: 9999px;
        border: 2px solid var(--boot-track);
        border-top-color: var(--boot-head);
        animation: boot-splash-spin 800ms linear infinite;
        animation-delay: var(--boot-phase, 0ms);
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-spinner {
          animation: none;
        }
      }
      @keyframes boot-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div
      id="boot-splash"
      class="boot-splash"
      role="status"
      aria-live="polite"
      aria-label="Loading"
    >
      <svg
        viewBox="0 0 32 32"
        width="40"
        height="40"
        class="boot-splash-mark"
        fill="currentColor"
        aria-hidden="true"
      >
        <rect x="4" y="21.5" width="12" height="5" rx="2.5" />
        <rect x="10" y="13.5" width="12" height="5" rx="2.5" />
        <rect x="23" y="5.5" width="5" height="5" rx="2.5" />
      </svg>
      <span class="boot-splash-spinner"></span>
    </div>
    <script>
      try {
        document
          .getElementById('boot-splash')
          .style.setProperty(
            '--boot-phase',
            '-' + Math.round(performance.now() % 800) + 'ms'
          );
      } catch (error) {}
    </script>
    <noscript>
      <style>
        #boot-splash {
          display: none;
        }
      </style>
      <p style="padding: 2rem; text-align: center">
        Standupless requires JavaScript. Please enable JavaScript in your
        browser.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
