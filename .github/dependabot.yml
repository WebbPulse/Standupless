
version: 2

registries:
  codeartifact-python:
    type: python-index
    url: https://webbpulse-432410731887.d.codeartifact.us-west-2.amazonaws.com/pypi/python/simple/
    aws-region: us-west-2
    account-id: "432410731887"
    role-name: artifacts-shared-dependabot-reader
    domain: webbpulse
    domain-owner: "432410731887"
  codeartifact-npm:
    type: npm-registry
    url: https://webbpulse-432410731887.d.codeartifact.us-west-2.amazonaws.com/npm/npm/
    aws-region: us-west-2
    account-id: "432410731887"
    role-name: artifacts-shared-dependabot-reader
    domain: webbpulse
    domain-owner: "432410731887"

updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    target-branch: "staging"
    registries: [codeartifact-python]
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "webbpulse"
    groups:
      minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "staging"
    registries: [codeartifact-npm]
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "@webbpulse/*"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
