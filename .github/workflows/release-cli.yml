name: Release CLI

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the CLI distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
          python-version: "3.13"

      - name: Check the tag matches the project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG#cli-v}"
          PROJECT_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "Tag version: ${TAG_VERSION}, project version: ${PROJECT_VERSION}"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::tag ${TAG} does not match project.version ${PROJECT_VERSION} in cli/pyproject.toml"
            exit 1
          fi

      - name: Install dependencies
        run: uv lock --check && uv sync --locked

      - name: Run the test suite
        run: uv run --no-sync pytest -n auto

      - name: Build the distribution
        run: uv build --out-dir dist

      - name: Upload the distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-dist
          path: cli/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/standupless-cli/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-dist
          path: dist/

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
