name: CI

on:
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      cli: ${{ steps.filter.outputs.cli }}
      desktop: ${{ steps.filter.outputs.desktop }}
      mobile: ${{ steps.filter.outputs.mobile }}
      frontend_paths: ${{ steps.filter.outputs.frontend_paths }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'backend/openapi.json'
              - '.github/workflows/ci.yml'
            cli:
              - 'cli/**'
              - 'backend/openapi.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release-cli.yml'
            desktop:
              - 'desktop/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release-desktop.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release-mobile.yml'
            frontend_paths:
              - 'frontend/src/api/**'
              - 'backend/tests/common/test_frontend_paths.py'
              - 'backend/tests/common/route_contract.json'
              - '.github/workflows/ci.yml'

  affected:
    name: Resolve the affected domains
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      domains: ${{ steps.affected.outputs.domains }}
      shared: ${{ steps.affected.outputs.shared }}
      reason: ${{ steps.affected.outputs.reason }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # ci.yml is deliberately not in extra-full-paths: a change to the CI workflow
      # cannot change which tests cover which domain, and the changes job already
      # gates the backend job on it, so a workflow-only pull request runs lint, type
      # check and security over the whole tree and no test shard.
      - name: Work out the affected domains
        id: affected
        uses: WebbPulse/.github/actions/affected-domains@v3
        with:
          working-directory: backend
          base-from-event: "true"
          head: ${{ github.sha }}
          mode: ci

  backend:
    name: Backend
    needs: [changes, affected]
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: WebbPulse/.github/.github/workflows/python-ci.yml@v3
    with:
      python-version: "3.13"
      working-directory: backend
      install-command: >-
        uv lock --check &&
        uv lock --upgrade-package webbpulse &&
        uv sync --locked &&
        uv run --no-sync python -c
        'import importlib.metadata as m; print("webbpulse", m.version("webbpulse"))'
      ruff-target: "app tests scripts"
      typecheck-command: pyright
      security-commands: |
        bandit -r app -ll
        uv export --frozen --no-dev --no-emit-project --no-hashes --no-emit-package webbpulse -o /tmp/requirements-audit.txt && pip-audit --no-deps --ignore-vuln CVE-2026-114603 -r /tmp/requirements-audit.txt
      pytest-args: "--dist=loadfile"
      pytest-workers: auto
      coverage-source: app
      domains-filter: ${{ needs.affected.outputs.domains }}
      run-shared: ${{ needs.affected.outputs.shared == 'true' }}
      test-env-json: |
        {
          "SECRET_KEY": "test-secret-key-for-ci",
          "ACCESS_TOKEN_EXPIRE_MINUTES": "30",
          "ALLOWED_ORIGINS": "http://localhost:3000,http://localhost:4000",
          "DEBUG": "true",
          "API_STR": "/api",
          "EMAIL_FROM": "test@example.com"
        }
      codeartifact-domain: webbpulse
      codeartifact-index: codeartifact
      aws-region: us-west-2
    secrets:
      role-to-assume: ${{ vars.CI_AWS_ROLE_ARN }}
      codeartifact-domain-owner: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: WebbPulse/.github/.github/workflows/typescript-ci.yml@v3
    with:
      node-version: "22"
      working-directory: frontend
      install-command: |
        npm ci && npm update $(node -p "const p=require('./package.json');Object.keys({...p.dependencies,...p.devDependencies}).filter(n=>n.startsWith('@webbpulse/')).join(' ')") && { npm ls --depth=0 2>/dev/null | grep @webbpulse || true; }
      lint-command: npm run lint
      format-check-command: npm run format:check
      typecheck-command: npm run type-check
      test-command: npm run test:run -- --coverage
      build-command: npm run build
      audit-level: moderate
      circular-imports-path: src/
      codeartifact-domain: webbpulse
      codeartifact-repository: npm
      codeartifact-namespace: "@webbpulse"
      aws-region: us-west-2
    secrets:
      role-to-assume: ${{ vars.CI_AWS_ROLE_ARN }}
      codeartifact-domain-owner: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}

  cli:
    name: CLI
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    permissions:
      contents: read
      id-token: write
    uses: WebbPulse/.github/.github/workflows/python-ci.yml@v3
    with:
      python-version: "3.13"
      working-directory: cli
      install-command: uv lock --check && uv sync --locked
      ruff-target: "src tests scripts"
      lint-commands: |
        python scripts/generate_models.py --check
      typecheck-command: pyright
      security-commands: |
        bandit -r src -ll
        uv export --frozen --no-dev --no-emit-project --no-hashes -o /tmp/requirements-audit.txt && pip-audit --no-deps -r /tmp/requirements-audit.txt
      pytest-workers: auto
      coverage-source: standupless_cli

  desktop:
    name: Desktop
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.CI_AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Log in to CodeArtifact
        env:
          DOMAIN_OWNER: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}
        run: |
          aws codeartifact login --tool npm --domain webbpulse \
            --domain-owner "$DOMAIN_OWNER" --repository npm \
            --namespace @webbpulse --region us-west-2

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  desktop-mac:
    name: Desktop macOS package
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.CI_AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Log in to CodeArtifact
        env:
          DOMAIN_OWNER: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}
        run: |
          aws codeartifact login --tool npm --domain webbpulse \
            --domain-owner "$DOMAIN_OWNER" --repository npm \
            --namespace @webbpulse --region us-west-2

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

      - name: Package the macOS zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_FOR_PULL_REQUEST: "true"
        run: npx electron-builder --config electron-builder.config.cjs --mac zip --universal --publish never

      - name: Verify the macOS app signs and launches
        timeout-minutes: 10
        run: |
          set -euo pipefail
          ZIPS=( release/production/*-mac.zip )
          if [ "${#ZIPS[@]}" -ne 1 ] || [ ! -f "${ZIPS[0]}" ]; then
            echo "::error::expected one macOS zip, found ${#ZIPS[@]}"
            exit 1
          fi
          scripts/verify-mac.sh "${ZIPS[0]}"

  mobile-ios:
    name: Mobile iOS (${{ matrix.environment }})
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        environment: [production, staging]
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Sync the native project
        env:
          STANDUPLESS_MOBILE_ENV: ${{ matrix.environment }}
        run: npx cap sync ios

      - name: Build the simulator app
        working-directory: mobile/ios/App
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          xcodebuild -version
          EXTRA=()
          if [ "$ENVIRONMENT" = "staging" ]; then
            EXTRA=(-xcconfig Staging.xcconfig)
          fi
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ${EXTRA[@]+"${EXTRA[@]}"} \
            CODE_SIGNING_ALLOWED=NO
          APP=build/Build/Products/Debug-iphonesimulator/App.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$APP/Info.plist"
          ditto -c -k --keepParent "$APP" "standupless-ios-simulator-${ENVIRONMENT}.zip"

      - name: Upload the simulator app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standupless-ios-simulator-${{ matrix.environment }}
          if-no-files-found: error
          retention-days: 7
          path: mobile/ios/App/standupless-ios-simulator-${{ matrix.environment }}.zip

  mobile-android:
    name: Mobile Android (${{ matrix.environment }})
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        environment: [production, staging]
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            mobile/android/*.gradle
            mobile/android/app/*.gradle
            mobile/android/gradle/wrapper/gradle-wrapper.properties

      - name: Install dependencies
        run: npm ci

      - name: Sync the native project
        env:
          STANDUPLESS_MOBILE_ENV: ${{ matrix.environment }}
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: mobile/android
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)/aapt2"
          "$AAPT" dump badging "$APK" | grep -E "^package:|^application-label:"
          "$AAPT" dump xmltree --file AndroidManifest.xml "$APK" | grep -E 'android:(scheme|host|pathPattern)'
          cp "$APK" "standupless-android-debug-${ENVIRONMENT}.apk"

      - name: Upload the debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standupless-android-debug-${{ matrix.environment }}
          if-no-files-found: error
          retention-days: 7
          path: mobile/android/standupless-android-debug-${{ matrix.environment }}.apk

  frontend-paths:
    name: Frontend paths match backend routes
    needs: changes
    if: needs.changes.outputs.frontend_paths == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pytest
        run: python -m pip install "pytest>=9.1.1"

      - name: Check every frontend path against the route contract
        run: python -m pytest tests/common/test_frontend_paths.py --noconftest -p no:cacheprovider -o addopts= -q

  e2e-local:
    name: E2E on a local stack
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.cli == 'true'
    permissions:
      contents: read
      id-token: write
      checks: write
    uses: WebbPulse/.github/.github/workflows/e2e-local.yml@v3
    with:
      working-directory: backend
      install-command: >-
        uv lock --check &&
        uv lock --upgrade-package webbpulse &&
        uv sync --locked --group e2e &&
        uv run --no-sync python -c "import importlib.metadata as m; print('webbpulse', m.version('webbpulse'))"
      pytest-args: "-o addopts="
      codeartifact-domain: webbpulse
      codeartifact-repository: npm
      codeartifact-namespace: "@webbpulse"
      aws-region: us-west-2
      frontend-directory: frontend
      frontend-build-env-json: >-
        {"VITE_API_URL": "http://localhost:8000"}
      preview-command: npx vite preview --host localhost --port 5173
      web-base-url: http://localhost:5173
      backend-env-json: >-
        {
          "APP_ENVIRONMENT": "local",
          "DEBUG": "true",
          "LOG_LEVEL": "INFO",
          "AWS_ACCESS_KEY_ID": "local",
          "AWS_SECRET_ACCESS_KEY": "local",
          "AWS_DEFAULT_REGION": "us-west-2",
          "DYNAMODB_ENDPOINT_URL": "http://localhost:8001",
          "DYNAMODB_TABLE_PREFIX": "standupless-e2e-local",
          "SECRET_KEY": "e2e-local-stack-secret-key",
          "API_STR": "/api",
          "ENABLE_RATE_LIMITING": "false",
          "RUN_STARTUP_TASKS": "false",
          "ALLOWED_ORIGINS": "http://localhost:5173",
          "FRONTEND_URL": "http://localhost:5173",
          "API_URL": "http://localhost:8000",
          "IDENTITY_ENVIRONMENT": "local",
          "IDENTITY_ISSUER": "http://localhost:8000/api/auth",
          "IDENTITY_AUDIENCE": "standupless-local-api",
          "IDENTITY_SIGNER": "local",
          "IDENTITY_SIGNING_KEY_ARNS": "[\"local\"]",
          "IDENTITY_COOKIE_SECURE": "false",
          "IDENTITY_COOKIE_SAMESITE": "lax",
          "IDENTITY_REGISTRATION_ENABLED": "true",
          "IDENTITY_EPHEMERAL_USERS_ENABLED": "true",
          "IDENTITY_PASSKEYS_ENABLED": "true",
          "IDENTITY_PASSKEYS_SECOND_FACTOR": "true",
          "IDENTITY_EMAIL_FROM": "",
          "IDENTITY_RP_ID": "localhost",
          "IDENTITY_RP_NAME": "Standupless local",
          "IDENTITY_WEBAUTHN_ORIGINS": "[\"http://localhost:5173\"]",
          "IDENTITY_GOOGLE_CLIENT_ID": "local-stack-google-client-id",
          "IDENTITY_GITHUB_CLIENT_ID": "local-stack-github-client-id",
          "IDENTITY_OAUTH_REDIRECT_URIS": "[\"http://localhost:8000/api/auth/oauth/callback\"]",
          "IDENTITY_MCP_OAUTH_ENABLED": "true",
          "IDENTITY_MCP_RESOURCE_URL": "http://localhost:8000/api/mcp",
          "IDENTITY_MCP_LOGIN_URL": "http://localhost:5173/login",
          "OAUTH_GOOGLE_CLIENT_SECRET": "local-stack-google-client-secret",
          "OAUTH_GITHUB_CLIENT_SECRET": "local-stack-github-client-secret",
          "GITHUB_APP_SLUG": "standupless-local",
          "GITHUB_APP_ID": "1",
          "GITHUB_WEBHOOK_SECRET": "local-stack-github-webhook-secret",
          "WEBHOOK_SIGNING_KEY": "local-stack-webhook-signing-key",
          "SLACK_CLIENT_ID": "local-stack-slack-client-id",
          "SLACK_CLIENT_SECRET": "local-stack-slack-client-secret",
          "SLACK_SIGNING_SECRET": "local-stack-slack-signing-secret",
          "DISCORD_APPLICATION_ID": "1000000000000000001",
          "DISCORD_PUBLIC_KEY": "bcf89e8d80188588b24a8aa19066c7365e40b260ca0b64cee971fecae3c4492c",
          "DISCORD_CLIENT_SECRET": "local-stack-discord-client-secret",
          "DISCORD_BOT_TOKEN": "local-stack-discord-bot-token",
          "E2E_USER_EMAIL": "e2e-local-user@standupless.dev",
          "E2E_USER_PASSWORD": "E2eLocalStackPassw0rd",
          "ATTACHMENTS_BUCKET": "standupless-e2e-local-imports",
          "AWS_ENDPOINT_URL_S3": "http://127.0.0.1:9100",
          "AWS_REQUEST_CHECKSUM_CALCULATION": "when_required",
          "AWS_RESPONSE_CHECKSUM_VALIDATION": "when_required",
          "LINEAR_API_URL": "http://127.0.0.1:8765/graphql",
          "IDENTITY_TOTP_MASTER_KEY": "ZTJlLWxvY2FsLXN0YWNrLW9ubHktbWFzdGVyLWtleSE=",
          "SSO_TRUSTED_HOSTS": "localhost",
          "SSO_SKIP_DNS_VERIFICATION": "true",
          "KEYCLOAK_URL": "http://localhost:8080"
        }
      backend-start-command: >-
        uv run --no-sync uvicorn app.common.composition.app:app --host localhost --port 8000
      api-base-url: http://localhost:8000
      health-path: /health
      # GITHUB_PRIVATE_KEY is generated here rather than written into this file: the
      # GitHub routes answer 503 without one, and a PEM inline in a workflow reads
      # like a real credential even when it is thrown away at the end of the run.
      table-bootstrap-command: >-
        docker run -d --name keycloak -p 8080:8080
        -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin
        quay.io/keycloak/keycloak:26.0.7 start-dev &&
        uv run --no-sync python scripts/create_local_tables.py &&
        uv run --no-sync python scripts/create_local_e2e_user.py &&
        uv run --no-sync python scripts/write_local_github_key.py &&
        (nohup uv run --no-sync python scripts/local_s3.py > local-s3.log 2>&1 &) &&
        timeout 240 bash -c 'until curl -sf http://localhost:8080/realms/master > /dev/null; do sleep 3; done'
      dynamodb-port: 8001
      check-name: "e2e (local)"
      fail-on-suite-failure: true
    secrets:
      role-to-assume: ${{ vars.CI_AWS_ROLE_ARN }}
      codeartifact-domain-owner: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}

  all-checks-passed:
    name: all-checks-passed
    runs-on: ubuntu-latest
    needs:
      - changes
      - affected
      - backend
      - frontend
      - cli
      - desktop
      - desktop-mac
      - mobile-ios
      - mobile-android
      - frontend-paths
      - e2e-local
    if: always()
    steps:
      - name: Fail unless every upstream job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "::error::at least one upstream job failed or was cancelled"
            exit 1
          fi
          echo "Every upstream job succeeded or was skipped."
