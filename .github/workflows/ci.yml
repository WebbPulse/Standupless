name: CI

on:
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  affected:
    name: Resolve the affected domains
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      domains: ${{ steps.affected.outputs.domains }}
      shared: ${{ steps.affected.outputs.shared }}
      reason: ${{ steps.affected.outputs.reason }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # An all-zero sha is what a push event reports for a branch's first push, and
      # it resolves to nothing, so it is passed through as an empty base, which the
      # action reports as unknown and answers with every domain.
      - name: Resolve the base commit
        id: base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BASE="${PR_BASE_SHA:-$PUSH_BEFORE_SHA}"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=""
          fi
          if [ -n "$BASE" ] && ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE" || true
          fi
          echo "Base: ${BASE:-none, so every domain}"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"

      # ci.yml is deliberately not in extra-full-paths: a change to the CI workflow
      # cannot change which tests cover which domain, and the changes job already
      # gates the backend job on it, so a workflow-only pull request runs lint, type
      # check and security over the whole tree and no test shard.
      - name: Work out the affected domains
        id: affected
        uses: WebbPulse/.github/actions/affected-domains@v3
        with:
          working-directory: backend
          base: ${{ steps.base.outputs.base }}
          head: ${{ github.sha }}
          mode: ci

  backend:
    name: Backend
    needs: [changes, affected]
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: WebbPulse/.github/.github/workflows/python-ci.yml@v3
    with:
      python-version: "3.13"
      working-directory: backend
      install-command: >-
        uv lock --check &&
        uv lock --upgrade-package webbpulse &&
        uv sync --locked &&
        uv run --no-sync python -c
        'import importlib.metadata as m; print("webbpulse", m.version("webbpulse"))'
      ruff-target: "app tests scripts"
      typecheck-command: pyright
      security-commands: |
        bandit -r app -ll
        uv export --frozen --no-dev --no-emit-project --no-hashes --no-emit-package webbpulse -o /tmp/requirements-audit.txt && pip-audit --no-deps -r /tmp/requirements-audit.txt
      pytest-args: "--dist=loadfile"
      pytest-workers: auto
      coverage-source: app
      domains-filter: ${{ needs.affected.outputs.domains }}
      run-shared: ${{ needs.affected.outputs.shared == 'true' }}
      test-env-json: |
        {
          "SECRET_KEY": "test-secret-key-for-ci",
          "ACCESS_TOKEN_EXPIRE_MINUTES": "30",
          "ALLOWED_ORIGINS": "http://localhost:3000,http://localhost:4000",
          "DEBUG": "true",
          "API_STR": "/api",
          "EMAIL_FROM": "test@example.com"
        }
      codeartifact-domain: webbpulse
      codeartifact-index: codeartifact
      aws-region: us-west-2
    secrets:
      role-to-assume: ${{ vars.CI_AWS_ROLE_ARN }}
      codeartifact-domain-owner: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: WebbPulse/.github/.github/workflows/typescript-ci.yml@v3
    with:
      node-version: "22"
      working-directory: frontend
      install-command: |
        npm ci && npm update $(node -p "const p=require('./package.json');Object.keys({...p.dependencies,...p.devDependencies}).filter(n=>n.startsWith('@webbpulse/')).join(' ')") && { npm ls --depth=0 2>/dev/null | grep @webbpulse || true; }
      lint-command: npm run lint
      format-check-command: npm run format:check
      typecheck-command: npm run type-check
      test-command: npm run test:run -- --coverage
      build-command: npm run build
      codeartifact-domain: webbpulse
      codeartifact-repository: npm
      codeartifact-namespace: "@webbpulse"
      aws-region: us-west-2
    secrets:
      role-to-assume: ${{ vars.CI_AWS_ROLE_ARN }}
      codeartifact-domain-owner: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}

  frontend-audit-and-imports:
    name: Frontend audit and imports
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Audit dependencies for vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: Check circular imports
        working-directory: frontend
        run: npx --yes madge --circular --extensions ts,tsx src/

  all-checks-passed:
    name: all-checks-passed
    runs-on: ubuntu-latest
    needs:
      - changes
      - affected
      - backend
      - frontend
      - frontend-audit-and-imports
    if: always()
    steps:
      - name: Fail unless every upstream job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "::error::at least one upstream job failed or was cancelled"
            exit 1
          fi
          echo "Every upstream job succeeded or was skipped."
