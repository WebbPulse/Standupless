name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      fresh-dependencies:
        description: >-
          Force a fresh dependency resolution instead of keying the layer on the
          newest published webbpulse version. The images are pushed under their
          own tag, so this rebuilds and redeploys even on a commit that is
          already deployed.
        type: boolean
        required: false
        default: false
  push:
    branches: [main, staging]
    paths:
      - "backend/**"
      - "!backend/tests/**"
      - "!backend/e2e/**"
      - "!backend/scripts/**"
      - "!backend/README.md"
      - "!backend/docs/**"
      - ".github/workflows/deploy-backend.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: backend-images-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-env:
    if: vars.BACKEND_IMAGE_BUILD_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
      id-token: write
    outputs:
      name: ${{ steps.values.outputs.name }}
      role-arn: ${{ steps.values.outputs.role-arn }}
      dependency-stamp: ${{ steps.stamp.outputs.dependency-stamp }}
    steps:
      - name: Resolve the environment values
        id: values
        env:
          ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
          ROLE_TO_ASSUME: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "$ROLE_TO_ASSUME" ]; then
            echo "vars.AWS_DEPLOY_ROLE_ARN is not set on the ${ENVIRONMENT} environment."
            exit 1
          fi
          echo "Environment: ${ENVIRONMENT}"
          echo "name=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "role-arn=${ROLE_TO_ASSUME}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials via OIDC
        if: inputs.fresh-dependencies != true
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ steps.values.outputs.role-arn }}
          aws-region: us-west-2

      - name: Resolve the dependency stamp
        id: stamp
        env:
          FRESH_DEPENDENCIES: ${{ inputs.fresh-dependencies }}
          RUN_ID: ${{ github.run_id }}
          CODEARTIFACT_DOMAIN_OWNER: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}
        run: |
          set -euo pipefail
          if [ "$FRESH_DEPENDENCIES" = "true" ]; then
            STAMP="$RUN_ID"
            echo "fresh-dependencies was requested, so the dependency layer is rebuilt."
          else
            if [ -z "$CODEARTIFACT_DOMAIN_OWNER" ]; then
              echo "vars.CODEARTIFACT_DOMAIN_OWNER is not set, so the newest webbpulse version cannot be resolved."
              exit 1
            fi
            STAMP="$(aws codeartifact list-package-versions \
              --domain webbpulse \
              --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
              --repository python \
              --format pypi \
              --package webbpulse \
              --status Published \
              --sort-by PUBLISHED_TIME \
              --query 'versions[0].version' \
              --output text)"
            if [ -z "$STAMP" ] || [ "$STAMP" = "None" ]; then
              echo "No Published webbpulse version resolved from CodeArtifact, so the dependency layer cannot be keyed."
              exit 1
            fi
          fi
          echo "Dependency stamp: ${STAMP}"
          echo "dependency-stamp=${STAMP}" >> "$GITHUB_OUTPUT"

  affected:
    name: Resolve the affected domains
    needs: resolve-env
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      domains: ${{ steps.matrix.outputs.domains }}
      any: ${{ steps.affected.outputs.any }}
      all: ${{ steps.affected.outputs.all }}
      reason: ${{ steps.affected.outputs.reason }}
      base: ${{ steps.base.outputs.base }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The base is the head sha of the most recent successful run of this workflow
      # on this branch. That is a correct floor: a successful run means every domain
      # was either rebuilt at that sha or was not affected by it, so everything
      # deployed is at least as new as that commit. A run that failed part way never
      # becomes the base, so the next run diffs from further back and automatically
      # rebuilds whatever the failed run left behind. An empty base, and a base that
      # is not an ancestor of head, are both reported as unknown, which yields every
      # domain. A manual dispatch also yields every domain: it exists to redeploy,
      # and a dispatch on an already deployed commit would otherwise do nothing.
      - name: Resolve the base commit
        id: base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          FRESH_DEPENDENCIES: ${{ inputs.fresh-dependencies }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${FRESH_DEPENDENCIES:-false}" = "true" ]; then
            echo "fresh-dependencies was requested, so every domain rebuilds."
            echo "base=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "A manual dispatch redeploys every domain."
            echo "base=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CANDIDATES=$(gh api \
            "repos/${GH_REPO}/actions/workflows/deploy-backend.yml/runs?branch=${REF_NAME}&status=success&event=push&per_page=20" \
            --jq '.workflow_runs[].head_sha')

          BASE=""
          for SHA in $CANDIDATES; do
            [ "$SHA" = "$GITHUB_SHA" ] && continue
            if ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
              continue
            fi
            if git merge-base --is-ancestor "$SHA" "$GITHUB_SHA"; then
              BASE="$SHA"
              break
            fi
          done

          if [ -z "$BASE" ]; then
            echo "No successful run on ${REF_NAME} has a head sha that is an ancestor of ${GITHUB_SHA}."
          else
            echo "Base: ${BASE}"
          fi
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"

      - name: Work out the affected domains
        id: affected
        uses: WebbPulse/.github/actions/affected-domains@v3
        with:
          working-directory: backend
          base: ${{ steps.base.outputs.base }}
          head: ${{ github.sha }}
          mode: deploy
          extra-full-paths: |
            .github/workflows/deploy-backend.yml

      # The action names a domain after its app/domains/ directory, which is a Python
      # package and so underscored, while every deploy target is hyphenated: the ECR
      # repository, the Lambda function and the API Gateway route key. The Dockerfile
      # maps the hyphen back with tr for the DOMAIN build argument.
      - name: Translate the domain names for the matrix
        id: matrix
        env:
          DOMAINS: ${{ steps.affected.outputs.domains }}
        run: |
          set -euo pipefail
          MATRIX=$(printf '%s' "$DOMAINS" \
            | python3 -c 'import json,sys; print(json.dumps([d.replace("_", "-") for d in json.load(sys.stdin)]))')
          echo "Matrix domains: ${MATRIX}"
          echo "domains=${MATRIX}" >> "$GITHUB_OUTPUT"

      - name: Write the verdict to the summary
        env:
          REASON: ${{ steps.affected.outputs.reason }}
          DOMAINS: ${{ steps.matrix.outputs.domains }}
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          {
            echo "## Deploy scope"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| base | \`${BASE:-none, so every domain}\` |"
            echo "| head | \`${GITHUB_SHA}\` |"
            echo "| domains | \`${DOMAINS}\` |"
            echo
            echo "${REASON}"
          } >> "$GITHUB_STEP_SUMMARY"

  warm-base-image:
    name: Warm the base image cache
    needs: [resolve-env, affected]
    if: needs.affected.outputs.any == 'true'
    permissions:
      contents: read
      id-token: write
    uses: WebbPulse/.github/.github/workflows/base-image-cache.yml@v3
    with:
      environment: ${{ needs.resolve-env.outputs.name }}
      aws-region: us-west-2
      dockerfile: backend/Dockerfile
      platform: linux/arm64
      additional-ecr-registries: "432410731887"
    secrets:
      role-to-assume: ${{ needs.resolve-env.outputs.role-arn }}

  build-images:
    needs: [resolve-env, affected, warm-base-image]
    if: >-
      always()
      && needs.affected.outputs.any == 'true'
      && needs.resolve-env.result == 'success'
      && needs.affected.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        domain: ${{ fromJSON(needs.affected.outputs.domains) }}
    permissions:
      contents: read
      id-token: write
    uses: WebbPulse/.github/.github/workflows/container-image.yml@v3
    with:
      environment: ${{ needs.resolve-env.outputs.name }}
      ecr-repository: standupless-${{ needs.resolve-env.outputs.name }}/${{ matrix.domain }}
      aws-region: us-west-2
      context: backend
      dockerfile: backend/Dockerfile
      platform: linux/arm64
      build-args: |
        DOMAIN=${{ matrix.domain }}
        DEPENDENCY_RESOLUTION=${{ needs.resolve-env.outputs.dependency-stamp }}
      codeartifact-domain: webbpulse
      codeartifact-domain-owner: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}
      codeartifact-repository: python
      additional-ecr-registries: "432410731887"
      image-tag-suffix: ${{ inputs.fresh-dependencies == true && format('deps-{0}', github.run_id) || '' }}
      skip-if-tag-exists: true
      upload-manifest-artifact: true
    secrets:
      role-to-assume: ${{ needs.resolve-env.outputs.role-arn }}

  image-map:
    needs: [resolve-env, affected, build-images]
    if: always() && needs.affected.outputs.any == 'true' && needs.build-images.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      function-image-map: ${{ steps.map.outputs.function-image-map }}
    steps:
      - name: Download the per-domain image manifests
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: manifests
          pattern: image-*
          merge-multiple: true

      - name: Assemble the function image map
        id: map
        env:
          ENVIRONMENT: ${{ needs.resolve-env.outputs.name }}
          DOMAINS: ${{ needs.affected.outputs.domains }}
        run: |
          set -euo pipefail
          mkdir -p manifests
          python3 - <<'PY' > function-image-map.json
          import json, os, pathlib

          env = os.environ["ENVIRONMENT"]
          out = {}
          expected = set(json.loads(os.environ["DOMAINS"]))
          built = set()

          consumers = {
              "views": ["views-notify-consumer", "views-search-consumer"],
              "integrations": [
                  "integrations-events-consumer",
                  "integrations-dispatch-consumer",
                  "integrations-stream-consumer",
              ],
          }

          for path in sorted(pathlib.Path("manifests").glob("*.json")):
              manifest = json.loads(path.read_text())
              domain = manifest["repository"].rsplit("/", 1)[-1]
              built.add(domain)
              out[f"standupless-{env}-{domain}"] = manifest["image_uri"]
              for consumer in consumers.get(domain, []):
                  out[f"standupless-{env}-{consumer}"] = manifest["image_uri"]

          missing = sorted(expected - built)
          if missing:
              raise SystemExit(f"No image manifest for affected domain(s): {', '.join(missing)}")

          print(json.dumps(out, indent=2))
          PY
          cat function-image-map.json

          MAP=$(python3 -c 'import json,sys; print(json.dumps(json.load(open("function-image-map.json"))))')
          echo "function-image-map=${MAP}" >> "$GITHUB_OUTPUT"

          TAGS=$(python3 -c '
          import json, pathlib

          tags = sorted({json.loads(p.read_text())["tag"] for p in pathlib.Path("manifests").glob("*.json")})
          print(", ".join(tags) if tags else "none")
          ')
          echo "image-tag=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Write the image map to the summary
        env:
          RESULT: ${{ needs.build-images.result }}
          IMAGE_TAG: ${{ steps.map.outputs.image-tag }}
          DOMAINS: ${{ needs.affected.outputs.domains }}
          REASON: ${{ needs.affected.outputs.reason }}
        run: |
          set -euo pipefail
          {
            echo "## Domain images"
            echo
            echo "Matrix result: \`${RESULT}\`. Tag: \`${IMAGE_TAG}\`."
            echo
            echo "Affected domains: \`${DOMAINS}\`. ${REASON}"
            echo
            echo "The map passed to \`lambda-image-deploy.yml\` as"
            echo "\`function-image-map\`, filtered to the functions that exist."
            echo "Every value is pinned by digest, not by tag."
            echo
            echo '```json'
            cat function-image-map.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the function image map
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: function-image-map
          path: function-image-map.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  existing-functions:
    needs: [resolve-env, image-map]
    if: >-
      always()
      && needs.image-map.result == 'success'
      && vars.BACKEND_IMAGE_DEPLOY_ENABLED == 'true'
      && needs.image-map.outputs.function-image-map != ''
      && needs.image-map.outputs.function-image-map != '{}'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.name }}
    permissions:
      contents: read
      id-token: write
    outputs:
      function-image-map: ${{ steps.filter.outputs.function-image-map }}
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ needs.resolve-env.outputs.role-arn }}
          aws-region: us-west-2

      - name: Drop the functions that do not exist yet
        id: filter
        env:
          FUNCTION_IMAGE_MAP: ${{ needs.image-map.outputs.function-image-map }}
        run: |
          set -euo pipefail

          FUNCTIONS=$(printf '%s' "$FUNCTION_IMAGE_MAP" \
            | python3 -c 'import json,sys; print("\n".join(sorted(json.load(sys.stdin))))')

          PRESENT=""
          MISSING=""
          while IFS= read -r FUNCTION; do
            [ -n "$FUNCTION" ] || continue
            set +e
            ERR=$(aws lambda get-function-configuration \
              --function-name "$FUNCTION" \
              --query 'FunctionName' --output text 2>&1 >/dev/null)
            STATUS=$?
            set -e

            if [ "$STATUS" -eq 0 ]; then
              PRESENT="${PRESENT}${FUNCTION}\n"
              continue
            fi

            case "$ERR" in
              *ResourceNotFoundException*|*"Function not found"*)
                MISSING="${MISSING}${FUNCTION}\n"
                ;;
              *)
                echo "$ERR"
                echo "get-function-configuration failed for ${FUNCTION} for a reason other than the function not existing."
                exit 1
                ;;
            esac
          done <<< "$FUNCTIONS"

          printf '%s' "$FUNCTION_IMAGE_MAP" \
            | PRESENT="$(printf "%b" "$PRESENT")" python3 -c '
          import json, os, sys

          full = json.load(sys.stdin)
          present = {n for n in os.environ["PRESENT"].split("\n") if n}
          json.dump({k: v for k, v in full.items() if k in present}, open("deploy-map.json", "w"), indent=2)
          '

          MAP=$(python3 -c 'import json; print(json.dumps(json.load(open("deploy-map.json"))))')
          echo "function-image-map=${MAP}" >> "$GITHUB_OUTPUT"

          {
            echo "## Deploy targets"
            echo
            if [ -n "$PRESENT" ]; then
              echo "Deploying:"
              echo
              printf "%b" "$PRESENT" | sed 's/^/- `/; s/$/`/'
            else
              echo "No domain function exists yet, so nothing is deployed. The images"
              echo "are built and pushed; the first apply with a non-empty"
              echo "bootstrap_image_tag creates the functions and the next run"
              echo "deploys them."
            fi
            if [ -n "$MISSING" ]; then
              echo
              echo "Not created yet, skipped:"
              echo
              printf "%b" "$MISSING" | sed 's/^/- `/; s/$/`/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-images:
    needs: [resolve-env, existing-functions]
    if: >-
      needs.existing-functions.result == 'success'
      && needs.existing-functions.outputs.function-image-map != ''
      && needs.existing-functions.outputs.function-image-map != '{}'
    permissions:
      contents: read
      id-token: write
    uses: WebbPulse/.github/.github/workflows/lambda-image-deploy.yml@v3
    with:
      environment: ${{ needs.resolve-env.outputs.name }}
      aws-region: us-west-2
      function-image-map: ${{ needs.existing-functions.outputs.function-image-map }}
      publish-version: true
      concurrency-group: backend-image-deploy-${{ needs.resolve-env.outputs.name }}
    secrets:
      role-to-assume: ${{ needs.resolve-env.outputs.role-arn }}

  smoke-domains:
    needs: [resolve-env, existing-functions, deploy-images]
    if: needs.deploy-images.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ needs.resolve-env.outputs.role-arn }}
          aws-region: us-west-2

      - name: Probe each deployed domain function
        env:
          FUNCTION_IMAGE_MAP: ${{ needs.existing-functions.outputs.function-image-map }}
        run: |
          set -euo pipefail

          cat > event.json <<'JSON'
          {
            "version": "2.0",
            "routeKey": "GET /health",
            "rawPath": "/health",
            "rawQueryString": "",
            "headers": {
              "accept": "application/json",
              "host": "smoke.invoke.local",
              "user-agent": "standupless-deploy-smoke"
            },
            "requestContext": {
              "accountId": "anonymous",
              "apiId": "smoke",
              "domainName": "smoke.invoke.local",
              "http": {
                "method": "GET",
                "path": "/health",
                "protocol": "HTTP/1.1",
                "sourceIp": "127.0.0.1",
                "userAgent": "standupless-deploy-smoke"
              },
              "requestId": "smoke",
              "routeKey": "GET /health",
              "stage": "$default",
              "time": "01/Jan/2026:00:00:00 +0000",
              "timeEpoch": 1767225600000
            },
            "isBase64Encoded": false
          }
          JSON

          FUNCTIONS=$(printf '%s' "$FUNCTION_IMAGE_MAP" \
            | python3 -c '
          import json, sys

          names = sorted(json.load(sys.stdin))
          print("\n".join(n for n in names if not n.endswith("-consumer")))
          ')

          FAILED=0
          while IFS= read -r FUNCTION; do
            [ -n "$FUNCTION" ] || continue
            echo "::group::${FUNCTION} GET /health"

            META=$(aws lambda invoke \
              --function-name "$FUNCTION" \
              --cli-binary-format raw-in-base64-out \
              --payload file://event.json \
              --cli-read-timeout 60 \
              response.json)
            echo "$META"

            STATUS=$(python3 -c '
          import json, sys

          try:
              payload = json.load(open("response.json"))
          except (OSError, ValueError):
              print("unparseable")
              sys.exit(0)
          print(payload.get("statusCode", "missing") if isinstance(payload, dict) else "not-an-object")
          ')

            if [ "$STATUS" = "200" ]; then
              echo "${FUNCTION} answered GET /health with 200."
            else
              echo "${FUNCTION} answered GET /health with ${STATUS}, expected 200."
              echo "Response payload:"
              cat response.json
              echo
              FAILED=1
            fi
            echo "::endgroup::"
          done <<< "$FUNCTIONS"

          if [ "$FAILED" -ne 0 ]; then
            echo "One or more domain functions failed the /health probe."
            exit 1
          fi
          echo "Every deployed domain function answered GET /health with 200."
