name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      fresh-dependencies:
        description: >-
          Force a fresh dependency resolution instead of keying the layer on the
          newest published webbpulse version. The images are pushed under their
          own tag, so this rebuilds and redeploys even on a commit that is
          already deployed.
        type: boolean
        required: false
        default: false
  push:
    branches: [main, staging]
    paths:
      - "backend/**"
      - "!backend/tests/**"
      - "!backend/e2e/**"
      - "!backend/scripts/**"
      - "!backend/README.md"
      - "!backend/docs/**"
      - ".github/workflows/deploy-backend.yml"
      - "slack/manifest.staging.json"
      - "slack/manifest.production.json"

permissions:
  id-token: write
  contents: read

concurrency:
  group: backend-images-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the domain functions
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
    uses: WebbPulse/.github/.github/workflows/lambda-domains-deploy.yml@v3
    with:
      aws-region: us-west-2
      ecr-repository-template: standupless-{environment}/{domain}
      function-name-template: standupless-{environment}-{domain}
      consumers-json: >-
        {"views": ["views-notify-consumer", "views-search-consumer", "views-purge-consumer"],
         "planning": ["planning-rollup-consumer", "planning-purge-consumer"],
         "integrations": ["integrations-events-consumer", "integrations-dispatch-consumer",
           "integrations-stream-consumer", "integrations-realtime-consumer",
           "integrations-purge-consumer", "integrations-import-consumer",
           "integrations-email-consumer"],
         "discussion": ["discussion-purge-consumer"],
         "issues": ["issues-purge-consumer"],
         "teams": ["teams-purge-consumer"],
         "workspaces": ["workspaces-purge-consumer", "workspaces-export-consumer"]}
      extra-full-paths: |
        .github/workflows/deploy-backend.yml
      fresh-dependencies: ${{ inputs.fresh-dependencies == true }}
      dependency-package: webbpulse
      codeartifact-domain: webbpulse
      codeartifact-repository: python
      additional-ecr-registries: "432410731887"
      smoke-user-agent: standupless-deploy-smoke
      bootstrap-note: >-
        The first apply with a non-empty bootstrap_image_tag creates the functions and the
        next run deploys them.
      plane-check-name: webbpulse-terraform
      plane-workspace-production: Standupless
      plane-workspace-staging: Standupless-staging

  slack-manifest-changed:
    name: Check whether the Slack manifest changed
    needs: deploy
    if: needs.deploy.outputs.any != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.slack.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Diff the manifest from the deploy base
        id: slack
        env:
          ENVIRONMENT: ${{ needs.deploy.outputs.environment }}
          BASE: ${{ needs.deploy.outputs.base }}
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          MANIFEST="slack/manifest.${ENVIRONMENT}.json"
          CHANGED=false
          if [ "$EVENT_NAME" = "push" ]; then
            FROM="$BASE"
            if [ -z "$FROM" ] && [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              FROM="$BEFORE"
            fi
            if [ -n "$FROM" ] && ! git diff --quiet "$FROM" "$GITHUB_SHA" -- "$MANIFEST"; then
              CHANGED=true
            fi
          fi
          echo "${MANIFEST} changed: ${CHANGED}"
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"

  slack-manifest:
    name: Apply the Slack manifest
    needs: [deploy, slack-manifest-changed]
    if: needs.slack-manifest-changed.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.deploy.outputs.environment }}
    concurrency:
      group: slack-config-token
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install boto3
        run: python -m pip install boto3

      - name: Apply the manifest
        env:
          ENVIRONMENT: ${{ needs.deploy.outputs.environment }}
          SLACK_CONFIG_ROLE_ARN: ${{ vars.SLACK_CONFIG_ROLE_ARN || 'arn:aws:iam::147741822161:role/standupless-production-slack-config' }}
        run: |
          set -euo pipefail
          python scripts/apply_slack_manifest.py "$ENVIRONMENT" --role-arn "$SLACK_CONFIG_ROLE_ARN" --skip-unprovisioned
