name: Release desktop

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: Open the draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the tag matches the app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG#desktop-v}"
          APP_VERSION="$(node -p 'require("./desktop/package.json").version')"
          echo "Tag version: ${TAG_VERSION}, app version: ${APP_VERSION}"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::tag ${TAG} does not match version ${APP_VERSION} in desktop/package.json"
            exit 1
          fi

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "Standupless desktop ${TAG#desktop-v}" \
              --notes "Standupless desktop ${TAG#desktop-v}. These builds are unsigned."
          fi

  build:
    name: Build for ${{ matrix.name }}
    needs: draft
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS
            os: macos-latest
            flag: --mac
          - name: Windows
            os: windows-latest
            flag: --win
          - name: Linux
            os: ubuntu-latest
            flag: --linux
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

      - name: Package and upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --config electron-builder.config.cjs ${{ matrix.flag }} --publish always

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish and mark as latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
