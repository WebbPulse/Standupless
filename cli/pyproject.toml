[project]
name = "standupless-cli"
version = "0.1.0"
description = "Command line client for the Standupless issue tracker"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "httpx>=0.28.1",
  "typer>=0.20.0",
  "rich>=14.0.0",
  "keyring>=25.6.0",
]

[project.scripts]
standupless = "standupless_cli.main:run"

[dependency-groups]
dev = [
  "datamodel-code-generator==0.83.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
  "respx>=0.22.0",
  "ruff>=0.16.6",
  "pyright>=1.1.407",
  "bandit>=1.8.6",
  "pip-audit>=2.9.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "standupless_cli"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/standupless_cli/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["standupless_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"
