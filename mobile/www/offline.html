<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Standupless</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #141518; color: #e7e7eb; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
        box-sizing: border-box; text-align: center;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      h1 { margin: 0; font-size: 18px; font-weight: 600; }
      p { margin: 0; color: #9b9da7; max-width: 320px; }
      a {
        margin-top: 8px; padding: 10px 18px; border-radius: 8px;
        background: #26272c; color: #e7e7eb; text-decoration: none; font-weight: 500;
      }
    </style>
  </head>
  <body>
    <h1>Standupless is not reachable</h1>
    <p>Check your connection, then try again.</p>
    <a id="retry" href="#">Try again</a>
    <script>
      document.getElementById('retry').addEventListener('click', function (event) {
        event.preventDefault();
        var staging = /StanduplessMobile\/staging/.test(navigator.userAgent);
        window.location.replace(staging ? 'https://staging.standupless.dev' : 'https://standupless.dev');
      });
    </script>
  </body>
</html>
