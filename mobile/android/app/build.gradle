import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def capacitorConfigFile = file('src/main/assets/capacitor.config.json')
def standupless = capacitorConfigFile.exists()
    ? (new JsonSlurper().parse(capacitorConfigFile).plugins?.Standupless ?: [:])
    : [:]
def standuplessAppId = standupless.appId ?: 'dev.standupless.app'
def standuplessAppName = standupless.appName ?: 'Standupless'
def standuplessScheme = standupless.scheme ?: 'standupless'
def standuplessAppHost = standupless.appHost ?: 'standupless.dev'
def standuplessVersion = new JsonSlurper().parse(file('../../package.json')).version
def releaseKeystore = System.getenv('STANDUPLESS_ANDROID_KEYSTORE_PATH')

android {
    namespace = "dev.standupless.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId standuplessAppId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode((System.getenv('STANDUPLESS_ANDROID_VERSION_CODE') ?: '1') as int)
        versionName standuplessVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resValue 'string', 'app_name', standuplessAppName
        resValue 'string', 'title_activity_main', standuplessAppName
        resValue 'string', 'package_name', standuplessAppId
        resValue 'string', 'custom_url_scheme', standuplessScheme
        manifestPlaceholders = [
            standuplessScheme: standuplessScheme,
            standuplessAppHost: standuplessAppHost,
        ]
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('STANDUPLESS_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('STANDUPLESS_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('STANDUPLESS_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildFeatures {
        resValues = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
